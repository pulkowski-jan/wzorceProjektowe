spring:
  application:
    name: Wzorowy System Biletowy

  datasource:
    url: jdbc:sqlite:offers.db
    driver-class-name: org.sqlite.JDBC

  sql:
    init:
      mode: always

  output:
    ansi:
      enabled: detect

server:
  port: 8081



  datasource:
    url: jdbc:sqlite:offers.db
    driver-class-name: org.sqlite.JDBC

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.community.dialect.SQLiteDialect
