spring:
  application:
    name: Wzorowy System Biletowy

  datasource:
    url: jdbc:sqlite:offers.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      connection-init-sql: PRAGMA foreign_keys = ON
      data-source-properties:
        busy_timeout: 10000

  sql:
    init:
      mode: always

  output:
    ansi:
      enabled: detect

server:
  port: 8081
